services:
  - type: web
    name: volumeal-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: volumeal-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        value: '["https://volumeal-align.higgsfield.app","https://volumeal-frontend.onrender.com"]'
      - key: DEPTH_MODEL_IS_METRIC
        value: true

  - type: web
    name: volumeal-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: API_BACKEND_URL
        value: https://volumeal-backend.onrender.com

databases:
  - name: volumeal-db
    databaseName: volumeal
    user: voluuser
    plan: free
